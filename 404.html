<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | Gerald</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --crimson: #DC143C;
            --dark-bg: #0D0D0D;
            --white: #FFFFFF;
            --light-grey: #B0B0B0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, var(--dark-bg) 0%, #1A1A1A 100%);
            color: var(--white);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .container { max-width: 520px; }
        .code {
            font-family: 'Bebas Neue', cursive;
            font-size: clamp(100px, 20vw, 180px);
            color: var(--crimson);
            line-height: 1;
            text-shadow: 0 0 60px rgba(220,20,60,0.3);
        }
        h1 {
            font-family: 'Bebas Neue', cursive;
            font-size: clamp(24px, 5vw, 40px);
            color: var(--white);
            margin: 0.5rem 0 1rem;
            letter-spacing: 2px;
        }
        p {
            color: var(--light-grey);
            font-size: 1rem;
            line-height: 1.7;
            margin-bottom: 2rem;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.8rem 2rem;
            border-radius: 50px;
            background: linear-gradient(135deg, rgba(220,20,60,0.7), rgba(139,0,0,0.6));
            border: 1px solid rgba(220,20,60,0.5);
            color: var(--white);
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(220,20,60,0.35);
        }
        .divider {
            width: 60px;
            height: 2px;
            background: var(--crimson);
            margin: 1.5rem auto;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="code">404</div>
        <div class="divider"></div>
        <h1>Page Not Found</h1>
        <p>Looks like this page took a wrong turn. It might have been moved, deleted, or never existed in the first place.</p>
        <a href="index.html" class="btn">← Go Home</a>
    </div>
</body>
</html>
